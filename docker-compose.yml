services:
  bandcamp-plex:
    build: .
    image: bandcamp-plex:latest
    container_name: bandcamp-plex
    restart: unless-stopped
    # On Unraid, run as the "nobody:users" user (99:100) that owns the
    # shares. Override with your own UID:GID if different.
    user: "99:100"
    environment:
      BANDCAMP_USERNAME: "your_bandcamp_fan_username"
      BANDCAMP_FORMAT: "flac"           # flac, alac, mp3-320, mp3-v0, wav, ...
      PLEX_URL: "http://plex:32400"     # optional; omit to fall back to fs scan
      PLEX_TOKEN: "your_plex_token"     # optional
      PLEX_LIBRARY: "Music"
      CHECK_INTERVAL: "3600"            # seconds between syncs
      DRY_RUN: "false"
      TZ: "Etc/UTC"
    volumes:
      # cookies.txt + state.json live here
      - ./config:/config
      # Plex music library root on the Unraid array
      - /mnt/user/music:/music
      # Scratch space for zip files before unpacking
      - ./downloads:/downloads
